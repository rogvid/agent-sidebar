[metadata]
name = "agents"
description = "Monitor active agentic coding sessions (Claude, Codex, opencode, Pi) in tmux"

[source]
command = "agent-scan"
ansi = true
output = "{strip_ansi|split: :-1}"
watch = 1.0

[preview]
# -e keeps the pane's own SGR sequences, so the preview looks like the pane
# instead of a grey transcript of it. It pairs with ansi = true below, which
# is what tells television to render them rather than print them.
command = "tmux capture-pane -t '{strip_ansi|split: :-1}' -p -e -T 2>/dev/null"
ansi = true

[ui]
layout = "portrait"

[ui.preview_panel]
size = 70

[keybindings]
enter = "actions:attach"
ctrl-d = ["actions:kill_pane", "reload_source"]
ctrl-r = "reload_source"

[actions.attach]
description = "Switch to agent pane"
command = "tmux switch-client -t '{strip_ansi|split: :-1}' 2>/dev/null || tmux attach-session -t '{strip_ansi|split: :-1}'"
mode = "execute"

[actions.kill_pane]
description = "Kill agent pane"
command = "tmux kill-pane -t '{strip_ansi|split: :-1}'"
mode = "fork"
